# Production stack for one client. Run from this directory:
#   docker compose up -d --build
# Configuration: .env (domains, database password; see .env.example) and api.env (API settings and
# secrets; see api.env.example). First start: ./init-letsencrypt.sh. Details in .env.example.

name: ${COMPOSE_PROJECT_NAME:-grocery}

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    <<: *restart
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: grocery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: grocery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocery -d grocery"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    <<: *restart
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies pending database migrations, then exits. The API starts only after it succeeds.
  migrate:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: migrate
    image: ${COMPOSE_PROJECT_NAME:-grocery}-migrate
    environment:
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD}@postgres:5432/grocery
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *restart
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: ${COMPOSE_PROJECT_NAME:-grocery}-api
    env_file: api.env
    # These take priority over api.env.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4000"
      DATABASE_URL: postgresql://grocery:${POSTGRES_PASSWORD}@postgres:5432/grocery
      REDIS_URL: redis://redis:6379
      PUBLIC_API_URL: https://${API_DOMAIN:?Set API_DOMAIN in .env}
      # Nginx is the only way in and overwrites X-Forwarded-For with the client address.
      TRUST_PROXY: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  admin:
    <<: *restart
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-grocery}-admin
    environment:
      API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy

  nginx:
    <<: *restart
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Set ADMIN_DOMAIN in .env}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Reloads every 6 hours to pick up renewed certificates.
    command: ["/bin/sh", "-c", "while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    depends_on:
      - api
      - admin

  # Renews the HTTPS certificate when it is close to expiry (initial issue: ./init-letsencrypt.sh).
  certbot:
    <<: *restart
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]

  # Daily database dump into ./backups, keeping BACKUP_KEEP_DAYS days. Copy them off this server too.
  backup:
    <<: *restart
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: grocery
      PGDATABASE: grocery
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do /bin/sh /usr/local/bin/backup.sh; sleep 24h & wait $${!}; done"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  redis_data:
  letsencrypt:
  certbot_www:

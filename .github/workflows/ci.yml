name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: grocery
          POSTGRES_PASSWORD: grocery_ci
          POSTGRES_DB: grocery
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U grocery -d grocery"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://grocery:grocery_ci@localhost:5432/grocery
      TEST_DATABASE_SERVER_URL: postgresql://grocery:grocery_ci@localhost:5432/postgres
      TEST_REDIS_URL: redis://localhost:6379/15
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generated Prisma client matches the schema
        run: |
          pnpm --filter @grocery/api exec prisma generate
          git diff --exit-code -- apps/api/src/generated

      - name: Migrations match the schema
        working-directory: apps/api
        run: |
          pnpm exec prisma migrate deploy
          pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  # Production images for deploy/update.sh, tagged with the commit, so servers pull instead of build.
  images:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { name: api, file: apps/api/Dockerfile, target: runtime }
          - { name: migrate, file: apps/api/Dockerfile, target: migrate }
          - { name: admin, file: apps/admin/Dockerfile, target: "" }
          - { name: web, file: apps/web/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/grocery-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          # The cache only speeds up the next build; a failed upload must not fail a pushed image.
          cache-to: type=gha,mode=max,scope=${{ matrix.name }},ignore-error=true

  # Updates the test client's server to this commit (docs/deployment.md, "Automatic deploys").
  # The SSH key can only run deploy/ci-deploy.sh; the job token lets the server pull the images.
  # The repository variable DEPLOY_MOOZY set to "false" skips it while there is no moozy server.
  deploy-moozy:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_MOOZY != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-moozy
      cancel-in-progress: false
    permissions:
      packages: read
    steps:
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.MOOZY_SSH_KEY }}
          SSH_HOST: ${{ secrets.MOOZY_SSH_HOST }}
          SSH_KNOWN_HOSTS: ${{ secrets.MOOZY_SSH_KNOWN_HOSTS }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -o BatchMode=yes "$SSH_HOST" "$GITHUB_SHA $GITHUB_ACTOR"
